# ==========================================
# ForgeAI AI Configuration
# ==========================================

# Active AI provider
forgeai.ai.provider=ollama

# Ollama server
forgeai.ai.ollama-url=http://localhost:11434

# Local AI model
forgeai.ai.model=qwen3:4b

# Streaming will be implemented in a later phase
forgeai.ai.stream=false

# Spring Boot server
server.port=8080